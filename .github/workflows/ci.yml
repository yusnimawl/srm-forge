name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  fast:
    strategy:
      fail-fast: false
      matrix:
        # Free-tier minutes (Windows counts double): main and pull requests run Linux 3.12; version tags run the full matrix.
        os: ${{ fromJSON(startsWith(github.ref, 'refs/tags/v') && '["windows-latest", "ubuntu-latest"]' || '["ubuntu-latest"]') }}
        python-version: ${{ fromJSON(startsWith(github.ref, 'refs/tags/v') && '["3.12", "3.14"]' || '["3.12"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxcursor1 libxft2 libxinerama1
      - run: python -m pip install -e ".[dev,ngsolve,web]"
      - run: python -m pytest -m "not slow" --durations=15
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxcursor1 libxft2 libxinerama1
      - run: python -m pip install -e ".[web]"
      - run: python -m srmweb.openapi web/openapi.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run gen:api
        working-directory: web
      - run: git diff --exit-code web/src/api/schema.ts web/openapi.json
      - run: npm run build
        working-directory: web
      - run: npx vitest run
        working-directory: web
