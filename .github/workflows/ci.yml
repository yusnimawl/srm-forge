name: ci
permissions:
  contents: read
on:
  push:
    branches: [main]
    tags: ["v*"]
    # Skip changes that touch only Markdown. src/ and hil/ READMEs stay in: tests read the controller
    # READMEs and the HIL build hash covers hil/. Path filters do not apply to tag pushes.
    paths: ["**", "!**.md", "src/**", "hil/**"]
  pull_request:
    # Skip changes that touch only Markdown. src/ and hil/ READMEs stay in: tests read the controller
    # READMEs and the HIL build hash covers hil/. Path filters do not apply to tag pushes.
    paths: ["**", "!**.md", "src/**", "hil/**"]
jobs:
  fast:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]   # Windows is not run (owner, 2026-11-13); its open items are on the tracker backlog
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    # Linux runs the fast suite in about 44 min (2026-10-30).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxcursor1 libxft2 libxinerama1
      - run: python -m pip install -e ".[dev,ngsolve,web]"
      - run: python -m pytest -m "not slow" --durations=15
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxcursor1 libxft2 libxinerama1
      - run: python -m pip install -e ".[web]"
      - run: python -m srmweb.openapi web/openapi.json
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run gen:api
        working-directory: web
      - run: git diff --exit-code web/src/api/schema.ts web/openapi.json
      - run: npm run build
        working-directory: web
      - run: npx vitest run
        working-directory: web
