name: slow
permissions:
  contents: read
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 3 * * 0"   # weekly, Sunday 03:17 UTC, on main
  workflow_dispatch:
jobs:
  slow:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]   # Windows is not run (owner, 2026-11-13); its open items are on the tracker backlog
        # Three parts run side by side: validation about 1 h 45 min, web about 40 min, the rest about 2 h 55 min.
        part:
          - {name: validation, args: "tests/validation"}
          - {name: web, args: "tests/web"}
          - {name: rest, args: "--ignore=tests/validation --ignore=tests/web"}
    name: slow (${{ matrix.os }}, ${{ matrix.part.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxcursor1 libxft2 libxinerama1
      - run: python -m pip install -e ".[dev,ngsolve,web]"
      - run: python -m pytest -m slow --durations=25 ${{ matrix.part.args }}
