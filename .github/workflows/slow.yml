name: slow
permissions:
  contents: read
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 3 * * 0"   # weekly, Sunday 03:17 UTC, on main
  workflow_dispatch:
jobs:
  slow:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        # Three parts, so that none comes near the 6 h runner limit: on Windows the validation tests take about
        # 2 h 20 min, the web tests about 1 h 50 min and the rest about 3 h 40 min.
        part:
          - {name: validation, args: "tests/validation"}
          - {name: web, args: "tests/web"}
          - {name: rest, args: "--ignore=tests/validation --ignore=tests/web"}
    name: slow (${{ matrix.os }}, ${{ matrix.part.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxcursor1 libxft2 libxinerama1
      - run: python -m pip install -e ".[dev,ngsolve,web]"
      - run: python -m pytest -m slow --durations=25 ${{ matrix.part.args }}
