; Pinned platforms; PlatformIO itself is pinned in setup.bat / setup.sh.
[platformio]
src_dir = .

[env]
extra_scripts = pre:scripts/add_sources.py

[env:emulator]
platform = teensy@6.0.0
board = teensy41
build_src_filter = -<*> +<emulator/>
framework = arduino
upload_protocol = teensy-cli
build_flags = -DSRM_TABLE_FLOAT -O2

[env:controller]
platform = ststm32@20.0.0
board = nucleo_h723zg
build_src_filter = -<*> +<controller/>
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
build_flags = -O2 -DHSE_VALUE=8000000UL
