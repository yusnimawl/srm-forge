; Pinned platforms; PlatformIO itself is pinned in setup.bat / setup.sh.
[platformio]
src_dir = .

[env]
extra_scripts = pre:scripts/add_sources.py

[env:emulator]
platform = teensy@6.0.0
board = teensy41
build_src_filter = -<*> +<emulator/>
framework = arduino
; 816 MHz core clock, set by the core's startup before USB and the timers (owner decision; heatsink fitted)
board_build.f_cpu = 816000000L
upload_protocol = teensy-cli
; -O3 instead of the core's -O2: about 10 % less step time (measured on the board)
build_unflags = -O2
build_flags = -DSRM_TABLE_FLOAT -O3

[env:controller]
platform = ststm32@20.0.0
board = nucleo_h723zg
build_src_filter = -<*> +<controller/>
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
build_flags = -O2 -DHSE_VALUE=8000000UL
