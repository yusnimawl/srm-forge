[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "srmcore"
version = "0.3.0"
description = "Core engine of the SRM design tool: geometry, mesh, magnetostatics, maps"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.6",
    "gmsh>=4.12",
    "matplotlib>=3.8",
    "scipy>=1.12",
    "scikit-fem>=12,<13",
    "h5py>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "pymupdf>=1.24"]
ngsolve = ["ngsolve>=6.2.2601"]

[tool.hatch.build.targets.wheel]
packages = ["src/srmcore", "src/srmapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tests/maps"]
addopts = "-ra"
markers = ["slow: long-running validation tests (nightly or on demand)"]
