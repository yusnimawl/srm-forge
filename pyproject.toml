[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "srmcore"
version = "0.7.0"
description = "Core engine of the SRM design tool: geometry, mesh, magnetostatics, maps"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.12",
    "ezdxf>=1.3",
    "gmsh>=4.12",
    "matplotlib>=3.8",
    "scipy>=1.12",
    "scikit-fem>=12,<13",
    "h5py>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "pymupdf>=1.24", "httpx>=0.27"]
ngsolve = ["ngsolve>=6.2.2601"]
web = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9", "ziglang==0.16.0"]
sil = ["ziglang==0.16.0"]
hil = ["pyserial==3.5"]

[project.scripts]
srmweb = "srmweb.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/srmcore", "src/srmapp", "src/srmweb", "src/srmsil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tests/maps"]
addopts = "-ra"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:starlette.exceptions.StarletteDeprecationWarning"]
markers = ["slow: long-running validation tests (nightly or on demand)"]
